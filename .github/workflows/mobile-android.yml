name: mobile-android

on:
  push:
    branches:
      - main
    # A tag android-v<versionName> (android-v1.1) builds the signed app and
    # publishes it as a GitHub release; see deploy/README.md.
    tags:
      - 'android-v*'
    paths:
      - 'android/**'
      - 'resources/native-shell/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # The app shows the live site, so only Capacitor's own packages are
      # needed: no PHP and no Vite build. The one page built into the app is
      # resources/native-shell/index.html.
      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      # The Firebase project's app config, for push notifications. Without
      # the secret the app builds and runs, but gets no pushes.
      - name: Add the Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON secret: building without push notifications."
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manteion-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # The tag must name the version the app says it is, or the update
      # notice would compare the wrong numbers.
      - name: Check the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"/\1/p' android/app/build.gradle)
          if [ "$TAG" != "android-v$version" ]; then
            echo "The tag $TAG does not match versionName $version in android/app/build.gradle."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      # A release without the Firebase config would get no notifications,
      # and one without the key couldn't update the installed app.
      - name: Add the Firebase config and the signing key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          MANTEION_KEYSTORE_BASE64: ${{ secrets.MANTEION_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ] || [ -z "$MANTEION_KEYSTORE_BASE64" ]; then
            echo "The GOOGLE_SERVICES_JSON and MANTEION_KEYSTORE_BASE64 secrets are both needed for a release."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$MANTEION_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/manteion-release.jks"

      - name: Build the signed APK
        working-directory: android
        env:
          MANTEION_KEYSTORE_FILE: ${{ runner.temp }}/manteion-release.jks
          MANTEION_KEYSTORE_PASSWORD: ${{ secrets.MANTEION_KEYSTORE_PASSWORD }}
          MANTEION_KEY_ALIAS: manteion
          MANTEION_KEY_PASSWORD: ${{ secrets.MANTEION_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          rm -f "$RUNNER_TEMP/manteion-release.jks"
          cp android/app/build/outputs/apk/release/app-release.apk manteion.apk
          sha256sum manteion.apk > manteion.apk.sha256
          gh release create "$TAG" manteion.apk manteion.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Manteion for Android ${TAG#android-v}" \
            --notes "Download manteion.apk and open it on your phone; see https://www.manteion.no/app."

