name: mobile-ios

on:
  # No push trigger for now: iOS distribution is on hold until there's an
  # Apple Developer account to sign a real build, and macOS runners cost
  # 10x the Actions minutes of Linux ones — no point burning that on every
  # push for a build nobody can install yet. Trigger by hand when wanted,
  # or restore the push trigger from mobile-android.yml's when it's time.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Xcode only runs on macOS — this is the one GitHub-hosted runner family
    # that has it preinstalled, which is the whole reason this build lives
    # in CI rather than locally.
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Composer dependencies
        # The Vite build shells out to `artisan wayfinder:generate`, so the
        # app needs to be bootable (vendor/ + .env + APP_KEY) before it runs.
        run: |
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
          cp .env.example .env
          php artisan key:generate

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build for the iOS Simulator
        working-directory: ios/App
        # No code signing here on purpose: a real device / TestFlight build
        # needs an Apple Developer account's signing certificate, which is a
        # separate follow-up once that account exists. This produces a
        # Simulator-runnable build to confirm the project actually compiles.
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload Simulator build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manteion-ios-simulator-build
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
