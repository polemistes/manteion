<!doctype html>
<html lang="nb">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="color-scheme" content="light dark" />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: light)"
            content="#FFFFFF"
        />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: dark)"
            content="#131211"
        />
        <title>Manteion</title>
        <!--
            Shown by the service worker (public/sw.js) when a page can't load
            for want of a connection. Self-contained on purpose: nothing else
            is cached, so the logo is inline and there is no stylesheet to
            fetch. Bump OFFLINE_CACHE in sw.js after changing this file.
        -->
        <style>
            :root {
                --surface: #ffffff;
                --ink: #1c1a18;
                --muted: #6f6963;
                --accent: #c23132;
                --on-accent: #ffffff;
                color-scheme: light;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --surface: #131211;
                    --ink: #f2efeb;
                    --muted: #9c958e;
                    color-scheme: dark;
                }
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: max(24px, env(safe-area-inset-top)) 24px
                    max(24px, env(safe-area-inset-bottom));
                background: var(--surface);
                color: var(--ink);
                font:
                    16px/1.5 system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
                text-align: center;
            }

            main {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
                max-width: 28rem;
            }

            img {
                width: 64px;
                height: auto;
            }

            h1 {
                margin: 0 0 4px;
                font-size: 1.375rem;
                line-height: 1.3;
            }

            p {
                margin: 0;
            }

            .secondary {
                color: var(--muted);
                font-size: 0.9375rem;
            }

            .secondary h1 {
                font-size: 1.0625rem;
            }

            button {
                min-height: 44px;
                padding: 10px 22px;
                border: 0;
                border-radius: 999px;
                background: var(--accent);
                color: var(--on-accent);
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }

            button:focus-visible {
                outline: 3px solid var(--ink);
                outline-offset: 3px;
            }
        </style>
    </head>

            <section id="nb" lang="nb">
                <h1>Du er ikke på nett</h1>
                <p>
                    Manteion trenger internett. Siden lastes inn på nytt av seg
                    selv når du er tilkoblet igjen.
                </p>
            </section>

            <section id="en" lang="en" class="secondary">
                <h1>You're offline</h1>
                <p>
                    Manteion needs a connection. This page reloads by itself
                    once you're back online.
                </p>
            </section>

            <button id="retry" type="button">Prøv igjen</button>
        </main>

        <script>
            (function () {
                var english = !/^(nb|nn|no)\b/i.test(navigator.language || '');
                var nb = document.getElementById('nb');
                var en = document.getElementById('en');
                var retry = document.getElementById('retry');

                // The reader's language first; the other one below it.
                if (english) {
                    nb.parentNode.insertBefore(en, nb);
                    en.classList.remove('secondary');
                    nb.classList.add('secondary');
                    document.documentElement.lang = 'en';
                    retry.textContent = 'Try again';
                }

                retry.addEventListener('click', function () {
                    location.reload();
                });

                window.addEventListener('online', function () {
                    location.reload();
                });

                // A notification was clicked while this page was open: go
                // where it points.
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.addEventListener(
                        'message',
                        function (event) {
                            var data = event.data || {};

                            if (data.type === 'navigate' && data.url) {
                                if (event.ports[0]) {
                                    event.ports[0].postMessage({
                                        type: 'navigating',
                                    });
                                }

                                location.href = data.url;
                            }
                        },
                    );
                    navigator.serviceWorker.startMessages();
                }
            })();
        </script>
