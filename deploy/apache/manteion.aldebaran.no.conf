# manteion.aldebaran.no on port 80: everything is sent on to https. certbot
# also proves here that the name is ours when it fetches or renews the
# certificate.
# Install: /etc/httpd/conf/conf.d/manteion.aldebaran.no.conf

<VirtualHost *:80>
    ServerName manteion.aldebaran.no
    ErrorLog "/var/log/httpd/manteion.aldebaran.no-error_log"
    CustomLog "/var/log/httpd/manteion.aldebaran.no-access_log" combined

    RewriteEngine on
    RewriteRule ^ https://manteion.aldebaran.no%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
