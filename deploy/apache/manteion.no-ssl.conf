# manteion.no on port 443. Apache holds the certificate, serves the built
# files in public/ itself, runs PHP in Manteion's own PHP-FPM pool, and passes
# the WebSocket connections (/app/...) on to Reverb, which listens only on the
# server itself.
# Install: /etc/httpd/conf/conf.d/manteion.no-ssl.conf, once the certificate exists.

<VirtualHost *:443>
    ServerName manteion.no
    ServerAlias www.manteion.no
    ErrorLog "/var/log/httpd/manteion.no-error_log"
    CustomLog "/var/log/httpd/manteion.no-access_log" combined

    SSLCertificateFile /etc/letsencrypt/live/manteion.no/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/manteion.no/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # One address for the site: www.manteion.no goes to manteion.no (logins,
    # push and the home-screen app all belong to one address).
    RewriteEngine on
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ https://manteion.no%{REQUEST_URI} [END,NE,R=permanent]

    # app is a link to the current release, so a deploy switches the site in one step.
    DocumentRoot /home/manteion/app/public
    <Directory /home/manteion/app/public>
        # Laravel's own public/.htaccess sends every request that isn't a file to index.php.
        AllowOverride All
        Options FollowSymLinks
        Require all granted

        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php-fpm/manteion.sock|fcgi://manteion/"
        </FilesMatch>
    </Directory>

    # Live updates: the browsers' WebSocket connections go on to Reverb.
    # (Apache 2.4.47 and later carry WebSockets through mod_proxy_http.)
    ProxyTimeout 120
    ProxyPass /app/ http://127.0.0.1:8080/app/ upgrade=websocket
    ProxyPassReverse /app/ http://127.0.0.1:8080/app/

    # The built files carry a hash of their content in the name: they may be
    # kept for a year. The service worker must be checked for every visit.
    <LocationMatch "^/build/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Location "/sw.js">
        Header set Cache-Control "no-cache"
    </Location>
</VirtualHost>
