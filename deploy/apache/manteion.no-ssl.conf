# www.manteion.no on port 443. Apache holds the certificate, serves the built
# files in public/ itself, runs PHP in Manteion's own PHP-FPM pool, and passes
# the WebSocket connections (/app/...) on to Reverb, which listens only on the
# server itself.
# Install: /etc/httpd/conf/conf.d/manteion.no-ssl.conf, once the certificate exists.

<VirtualHost *:443>
    ServerName www.manteion.no
    ServerAlias manteion.no
    ErrorLog "/var/log/httpd/manteion.no-error_log"
    CustomLog "/var/log/httpd/manteion.no-access_log" combined

    SSLCertificateFile /etc/letsencrypt/live/manteion.no/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/manteion.no/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # One address for the site: manteion.no goes to www.manteion.no, which
    # the site has always used (logins, push and the home-screen app all
    # belong to one address).
    RewriteEngine on
    RewriteCond %{HTTP_HOST} !^www\. [NC]
    RewriteRule ^ https://www.manteion.no%{REQUEST_URI} [END,NE,R=permanent]

    # app is a link to the current release, so a deploy switches the site in one step.
    DocumentRoot /home/manteion/app/public
    <Directory /home/manteion/app/public>
        # Laravel's own public/.htaccess sends every request that isn't a file to index.php.
        AllowOverride All
        Options FollowSymLinks
        Require all granted

        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php-fpm/manteion.sock|fcgi://manteion/"
        </FilesMatch>
    </Directory>

    # Live updates: the browsers' WebSocket connections go on to Reverb.
    # (Apache 2.4.47 and later carry WebSockets through mod_proxy_http.)
    ProxyTimeout 120
    ProxyPass /app/ http://127.0.0.1:8080/app/ upgrade=websocket
    ProxyPassReverse /app/ http://127.0.0.1:8080/app/

    # Over a 5G line every round trip and every kilobyte counts: HTTP/2 sends
    # the many small built files over one connection, and text goes out
    # compressed (a third of its size or less). Both modules are switched on
    # in httpd.conf; until they are, these lines do nothing.
    <IfModule mod_http2.c>
        Protocols h2 http/1.1
    </IfModule>
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml
    </IfModule>

    # The built files carry a hash of their content in the name: they may be
    # kept for a year. The service worker must be checked for every visit.
    <LocationMatch "^/build/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Location "/sw.js">
        Header set Cache-Control "no-cache"
    </Location>
</VirtualHost>
