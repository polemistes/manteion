# manteion.no and www.manteion.no on port 80: everything is sent on to
# https://www.manteion.no. certbot also proves here that the names are ours
# when it fetches or renews the certificate.
# Install: /etc/httpd/conf/conf.d/manteion.no.conf

<VirtualHost *:80>
    ServerName www.manteion.no
    ServerAlias manteion.no
    ErrorLog "/var/log/httpd/manteion.no-error_log"
    CustomLog "/var/log/httpd/manteion.no-access_log" combined

    RewriteEngine on
    RewriteRule ^ https://www.manteion.no%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
