; Manteion's PHP: a pool of PHP-FPM workers of its own, running as the
; manteion user. Apache reaches it through a socket that only Apache's group
; (http) may open, as Nextcloud's pool does for php-fpm-legacy.
; Install: cp to /etc/php/php-fpm.d/manteion.conf, then systemctl reload php-fpm.

[manteion]
user = manteion
group = manteion

listen = /run/php-fpm/manteion.sock
listen.owner = manteion
listen.group = http
listen.mode = 0660

; Workers start when requests come in and stop after a minute without any.
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 60s
pm.max_requests = 500

; Pictures of up to 5 MB (the app's own limit), with room for the rest of the form.
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 10M
php_admin_value[memory_limit] = 256M

; Laravel writes its own log; what PHP itself reports goes to the journal.
catch_workers_output = yes
php_admin_flag[log_errors] = on
