# Arch's Apache service is fenced off from /home (ProtectHome=yes), but it
# serves Manteion's built files straight from /home/manteion/app/public.
# This lets it read /home/manteion, and nothing else in /home: with
# ProtectHome=tmpfs, /home is an empty folder to Apache, and the one path
# below is mounted into it read-only (PHP-FPM, which writes, is not fenced).
# Install: /etc/systemd/system/httpd.service.d/manteion.conf, then
# systemctl daemon-reload && systemctl restart httpd.

[Service]
ProtectHome=tmpfs
BindReadOnlyPaths=/home/manteion
